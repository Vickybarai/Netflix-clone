pipeline {
    agent any

    parameters {
        string(name: 'branch', defaultValue: 'main', description: 'Git branch')
    }

    environment {
        DOCKER_IMAGE = 'netflix1'
        DOCKER_REPO = 'baraivicky/netflix-project'
        DOCKER_TAG = 'latest'
        TARGET_IP = '172.31.XX.XX' // REPLACE WITH YOUR TARGET SERVER PRIVATE IP
        TARGET_USER = 'ubuntu'
        CONTAINER_NAME = 'netflix-app'
    }

    stages {
        stage('Git Checkout') {
            steps {
                git branch: "${params.branch}", 
                    credentialsId: 'github-creds', 
                    url: 'https://github.com/Vickybarai/Netflix-clone.git'
                
                echo '✅ STAGE COMPLETE: Git Checkout finished successfully.'
            }
        }

        stage('Build Docker Image') {
            steps {
                sh "docker build -t ${DOCKER_IMAGE} ."
                
                echo '✅ STAGE COMPLETE: Docker Image built successfully.'
            }
        }

        stage('Push to Docker Hub') {
            steps {
                withDockerRegistry(credentialsId: 'dockerhub', url: 'https://index.docker.io/v1/') {
                    sh "docker tag ${DOCKER_IMAGE} ${DOCKER_REPO}:${DOCKER_TAG}"
                    sh "docker push ${DOCKER_REPO}:${DOCKER_TAG}"
                }
                
                echo '✅ STAGE COMPLETE: Image pushed to Docker Hub successfully.'
            }
        }

        stage('Deploy to Target Server via SSH') {
            steps {
                sshagent(['ssh-target-creds']) {
                    sh """
                        ssh ${TARGET_USER}@${TARGET_IP} << 'EOF'
                        echo 'Stopping old container...'
                        docker stop ${CONTAINER_NAME} || true
                        docker rm ${CONTAINER_NAME} || true
                        
                        echo 'Pulling new image...'
                        docker pull ${DOCKER_REPO}:${DOCKER_TAG}
                        
                        echo 'Starting new container...'
                        docker run -d --name ${CONTAINER_NAME} -p 8080:80 ${DOCKER_REPO}:${DOCKER_TAG}
                        EOF
                    """
                }
                
                echo '✅ STAGE COMPLETE: Successfully deployed to the target server!'
            }
        }
    }

    post {
        always {
            cleanWs()
            echo '🧹 POST ACTION: Workspace cleaned up.'
        }
    }
}