pipeline{
    agent any
    tools{
        maven 'maven'
    }
    stages{
        stage('code'){
            steps{
                git branch: '$branch', url: 'https://github.com/Vickybarai/Netflix-clone/.git'
            }
        }
        stage('Build'){
            steps{
                sh 'mvn compile'
            }
        }
        stage('Test'){
            steps{
                sh 'mvn test'
            }
        }
        stage('Artifacts'){
            steps{
                sh 'mvn package'
            }
        }
        stage('build image'){
            steps{
                sh 'docker build -t netflix1 .'
            }
        }
        stage('Tag & Push'){
            steps{
                withDockerRegistry(credentialsId: 'dockerhub', url: 'https://index.docker.io/v1/') {
                    sh 'docker tag netflix1 baraivicky/netflix-project:latesttest'
                    sh 'docker push riteshprasad07/netflixproject01:latest'
                }
            }
        }
        stage('pull the image'){
            steps{
                sh 'docker pull riteshprasad07/netflixproject01:latest'
            }
        }
        stage('run the container'){pipeline {
    agent any

    parameters {
        string(name: 'branch', defaultValue: 'main', description: 'Git branch')
    }

    environment {
        DOCKER_IMAGE = 'netflix1'
        DOCKER_REPO = 'baraivicky/netflix-project'
        DOCKER_TAG = 'latest'
        TARGET_IP = '172.31.XX.XX' // REPLACE THIS WITH YOUR TOMCAT INSTANCE 2 PRIVATE IP
        TARGET_USER = 'ubuntu'
        CONTAINER_NAME = 'netflix-app'
    }

    tools {
        maven 'maven'
    }

    stages {
        stage('Git Checkout') {
            steps {
                git branch: "${params.branch}", 
                    credentialsId: 'github-creds', 
                    url: 'https://github.com/Vickybarai/Netflix-clone.git'
            }
        }

        stage('Build Maven Artifact') {
            steps {
                sh 'mvn clean package'
            }
        }

        stage('Build Docker Image') {
            steps {
                sh "docker build -t ${DOCKER_IMAGE} ."
            }
        }

        stage('Push to Docker Hub') {
            steps {
                withDockerRegistry(credentialsId: 'dockerhub', url: 'https://index.docker.io/v1/') {
                    sh "docker tag ${DOCKER_IMAGE} ${DOCKER_REPO}:${DOCKER_TAG}"
                    sh "docker push ${DOCKER_REPO}:${DOCKER_TAG}"
                }
            }
        }

        stage('Deploy to Target Server via SSH') {
            steps {
                // This tells Jenkins to use the SSH key we set up
                sshagent(['ssh-target-creds']) {
                    // SSH into the target server and run Docker commands remotely
                    sh """
                        ssh ${TARGET_USER}@${TARGET_IP} << 'EOF'
                        echo 'Stopping old container...'
                        docker stop ${CONTAINER_NAME} || true
                        docker rm ${CONTAINER_NAME} || true
                        
                        echo 'Pulling new image...'
                        docker pull ${DOCKER_REPO}:${DOCKER_TAG}
                        
                        echo 'Starting new container...'
                        docker run -d --name ${CONTAINER_NAME} -p 8080:8080 ${DOCKER_REPO}:${DOCKER_TAG}
                        EOF
                    """
                }
            }
        }
    }

    post {
        always {
            cleanWs()
        }
    }
}
            steps{
                sh 'docker run -d --name cont2 -p 8180:8080 riteshprasad07/netflixproject01:latest'
            }
        }
    }
}
